<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Arhitektonska bočica jantarnog parfema</title>
  <desc id="desc">Visoka pravougaona kristalna bočica s jantarnim mirisom na tamnom kamenom postolju.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset=".52" stop-color="#183148"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#f7c87f" stop-opacity=".42"/><stop offset="1" stop-color="#f7c87f" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#f9f4e5" stop-opacity=".72"/><stop offset=".12" stop-color="#b8d5df" stop-opacity=".14"/><stop offset=".48" stop-color="#fff" stop-opacity=".04"/><stop offset=".84" stop-color="#d4edf4" stop-opacity=".2"/><stop offset="1" stop-color="#fff7dd" stop-opacity=".68"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8ad58" stop-opacity=".62"/><stop offset=".6" stop-color="#8b4319" stop-opacity=".9"/><stop offset="1" stop-color="#4b210e"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#6f3c17"/><stop offset=".22" stop-color="#e8bc75"/><stop offset=".5" stop-color="#fff0b6"/><stop offset=".72" stop-color="#ae6b2f"/><stop offset="1" stop-color="#4f2811"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="38" stdDeviation="34" flood-color="#000" flood-opacity=".72"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="600" cy="690" rx="550" ry="590" fill="url(#halo)"/>
  <g opacity=".54" filter="url(#blur)">
    <circle cx="120" cy="315" r="42" fill="#ffd89d"/><circle cx="1080" cy="250" r="28" fill="#ffe3a8"/>
    <circle cx="1040" cy="760" r="54" fill="#79b9de"/><circle cx="185" cy="925" r="37" fill="#d29b58"/>
  </g>
  <path d="M0 310H1200M0 1070H1200" stroke="#b6d2e2" stroke-opacity=".12"/>
  <path d="M190 0V1500M1010 0V1500" stroke="#b6d2e2" stroke-opacity=".08"/>
  <ellipse cx="600" cy="1285" rx="400" ry="96" fill="#020406" opacity=".76" filter="url(#blur)"/>
  <path d="M178 1215 305 1105h590l127 110-77 159H255z" fill="#111820" stroke="#9ca9af" stroke-opacity=".32" stroke-width="3"/>
  <path d="M255 1215h690l-52 98H307z" fill="#05090d"/>
  <g filter="url(#shadow)">
    <rect x="452" y="226" width="296" height="152" rx="24" fill="url(#gold)"/>
    <rect x="476" y="242" width="248" height="29" rx="12" fill="#fff2bd" opacity=".34"/>
    <rect x="405" y="350" width="390" height="96" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity=".58" stroke-width="8"/>
    <rect x="320" y="420" width="560" height="770" rx="72" fill="url(#glass)" stroke="#f8fbf8" stroke-opacity=".72" stroke-width="12"/>
    <rect x="360" y="475" width="480" height="660" rx="46" fill="url(#amber)" stroke="#f8d89d" stroke-opacity=".38" stroke-width="5"/>
    <path d="M390 512v545M810 512v545" stroke="#fff" stroke-opacity=".3" stroke-width="20" filter="url(#soft)"/>
    <path d="M445 472c88-29 222-29 310 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8"/>
    <rect x="443" y="705" width="314" height="190" rx="4" fill="#20140d" fill-opacity=".3" stroke="#f4d5a1" stroke-opacity=".48"/>
    <path d="M506 800h188" stroke="#f9e6bd" stroke-width="3"/>
    <circle cx="600" cy="748" r="23" fill="none" stroke="#f9e6bd" stroke-width="3"/>
    <path d="M600 725v46" stroke="#f9e6bd" stroke-width="2"/>
  </g>
  <path d="M350 1194h500" stroke="#fff" stroke-opacity=".45" stroke-width="4"/>
</svg>